<!DOCTYPE html>
<html>
<head>
  <title>SkillSphere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="center">

  <div class="card glass">

    <div class="brand">
      <h1>SkillSphere</h1>
      <p>Assessment Portal</p>
    </div>

    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email Address">
    <input id="enrollment" placeholder="Enrollment ID">

    <button id="btn" onclick="start()">Start Exam</button>

    <div id="error" class="error"></div>

  </div>

</div>

<script>
const API = "https://skillsphere-exam.skillsphere-work.workers.dev";

async function start() {

  error.innerText = "";
  btn.innerText = "Starting...";
  btn.disabled = true;

  try {
    const res = await fetch(API + "/login", {
      method: "POST",
      body: JSON.stringify({
        name: name.value,
        email: email.value,
        enrollment_id: enrollment.value
      })
    });

    const data = await res.json();

    if (data.error) {
      error.innerText = data.error;
      btn.innerText = "Start Exam";
      btn.disabled = false;
      return;
    }

    localStorage.setItem("token", data.token);
    location.href = "quiz.html";

  } catch {
    error.innerText = "Something went wrong";
    btn.innerText = "Start Exam";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
