<div class="container glass">

  <h2>SkillSphere Exam Portal</h2>

  <input id="name" placeholder="Full Name">
  <input id="email" placeholder="Email">
  <input id="enrollment" placeholder="Enrollment ID">

  <button onclick="start()">Start Exam</button>

</div>

<script>
const API = "https://skillsphere-exam.skillsphere-work.workers.dev";

async function start() {
  const res = await fetch(API + "/login", {
    method: "POST",
    body: JSON.stringify({
      name: name.value,
      email: email.value,
      enrollment_id: enrollment.value
    })
  });

  const data = await res.json();

  if (data.error) return alert(data.error);

  localStorage.setItem("token", data.token);
  location.href = "quiz.html";
}
</script>
