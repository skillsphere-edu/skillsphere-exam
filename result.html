<!DOCTYPE html>
<html>
<head>
  <title>Result</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="content">

  <div class="glass question-box" style="text-align:center">

    <h1 id="scoreText"></h1>

    <div style="margin-top:20px; font-size:18px;">
      <div>✔ Correct: <span id="correct"></span></div>
      <div>❌ Wrong: <span id="wrong"></span></div>
      <div>⚪ Unattempted: <span id="skipped"></span></div>
    </div>

  </div>

</div>

<script>
const data = JSON.parse(localStorage.getItem("result"));

// COUNTS
let correct = 0;
let wrong = 0;
let skipped = 0;

data.answers.forEach(a => {
  if (!a) skipped++;
  else if (a.selected === a.correct) correct++;
  else wrong++;
});

// UI
scoreText.innerText = `Score: ${data.score} (${data.percentage.toFixed(2)}%)`;

document.getElementById("correct").innerText = correct;
document.getElementById("wrong").innerText = wrong;
document.getElementById("skipped").innerText = skipped;
</script>

</body>
</html>
